### model
model_name_or_path: repro_1p7b/models/Qwen3-1.7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: repro_1p7b/configs/ds_z3_config.json

### dataset
dataset: env_factory_parameter_aware_v1
dataset_dir: repro_1p7b/configs/llamafactory_parameter_aware_data
template: qwen3
mask_history: True
cutoff_len: 8192
max_samples: 1000000
overwrite_cache: false
preprocessing_num_workers: 1
dataloader_num_workers: 1

### output
output_dir: repro_1p7b/checkpoints/parameter_aware_sft_8k_1p7b/
logging_steps: 10
save_steps: 30
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard
save_strategy: epoch

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42
data_seed: 42
